name: Linux Mint Cinnamon Check

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  linux-mint-cinnamon:
    # Linux Mint 22 is based on Ubuntu 24.04. GitHub does not provide a
    # Linux Mint runner, so this validates the same Ubuntu base and Tk/X11
    # requirements used by a Cinnamon desktop installation.
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 python3-tk python3-venv xvfb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install build tools
        run: .venv/bin/python -m pip install --upgrade pip pyinstaller

      - name: Compile Python modules
        run: .venv/bin/python -m compileall -q main.py database.py calendar_view.py

      - name: Smoke test SQLite data layer
        run: |
          .venv/bin/python - <<'PY'
          import tempfile
          from database import Database

          with tempfile.NamedTemporaryFile(suffix=".db") as database_file:
              database = Database(database_file.name)
              meals = database.meals()
              assert meals, "Seed meals were not created"
              database.set_shopping_day("2026-09-14", True)
              assert "2026-09-14" in database.shopping_days_for_month(2026, 9)
              database.set_shopping_day("2026-09-14", False)
              assert "2026-09-14" not in database.shopping_days_for_month(2026, 9)
          PY

      - name: Smoke test Tkinter under X11
        run: |
          xvfb-run --auto-servernum .venv/bin/python - <<'PY'
          import tkinter as tk
          from main import MenuHelper

          app = MenuHelper()
          app.after(500, app.destroy)
          app.mainloop()
          PY

      - name: Build desktop executable
        run: .venv/bin/pyinstaller --noconfirm --clean --windowed --name MenuHelper main.py

      - name: Smoke test packaged executable under X11
        run: |
          set +e
          timeout --signal=TERM 10s xvfb-run --auto-servernum dist/MenuHelper
          status=$?
          set -e
          test "$status" -eq 124

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MenuHelper-linux-ubuntu24
          path: dist/MenuHelper/
